[project]
name = "test-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.7.0",
    "groq>=1.4.0",
    "httpx>=0.28.1",
    "instructor>=1.15.1",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
# Only collect the testing artifact (other modules share basenames like
# models.py/config.py, which pytest's default import mode can't disambiguate).
testpaths = ["testing-llm-calls"]
# auto = async tests run without a per-test @pytest.mark.asyncio marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: marks slow tests (deselect with -m 'not slow')"]
